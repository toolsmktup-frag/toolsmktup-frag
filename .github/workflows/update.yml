name: Atualiza card do perfil

on:
  schedule:
    - cron: "0 7 * * *" # 04h de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py, ascii.txt]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gera os SVGs
        env:
          # PROFILE_TOKEN (PAT seu, opcional) conta repos privados; sem ele, só o que é público
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python3 build.py
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg stats.json
          git diff --cached --quiet || (git commit -m "chore: atualiza stats do perfil" && git push)
